<style>
.error-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--green-900) 0%, var(--green-700) 100%);
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.error-page::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.02) 50px, rgba(255,255,255,0.02) 100px);
  pointer-events: none;
}

.error-container {
  max-width: 600px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.error-logo {
  width: 120px;
  height: 120px;
  margin: 0 auto 32px;
  filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
}

.error-code {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(80px, 15vw, 180px);
  color: var(--gold-400);
  line-height: 1;
  margin: 0 0 16px;
  text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
  letter-spacing: 4px;
}

.error-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 5vw, 42px);
  color: var(--white);
  margin: 0 0 16px;
  letter-spacing: 2px;
}

.error-message {
  color: rgba(255, 255, 255, 0.85);
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 40px;
}

.error-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.error-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 4px;
  transition: all 0.3s ease;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
  font-size: 18px;
}

.error-btn-primary {
  background: var(--gold-400);
  color: var(--green-900);
  box-shadow: 0 4px 16px rgba(244, 207, 90, 0.3);
}

.error-btn-primary:hover {
  background: var(--gold-500);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(244, 207, 90, 0.4);
}

.error-btn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: var(--white);
  border: 2px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
}

.error-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.5);
  transform: translateY(-2px);
}

.error-suggestions {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.error-suggestions h3 {
  color: var(--gold-300);
  font-size: 16px;
  margin-bottom: 16px;
  font-weight: 600;
}

.error-links {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}

.error-links a {
  color: rgba(255, 255, 255, 0.7);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.3s;
}

.error-links a:hover {
  color: var(--gold-300);
}

@media (max-width: 480px) {
  .error-code {
    font-size: 100px;
  }
  .error-btn {
    padding: 12px 24px;
    font-size: 16px;
  }
  .error-actions {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div class="error-page">
